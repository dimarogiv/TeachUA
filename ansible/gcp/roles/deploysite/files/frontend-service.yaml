apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose -f backend/compose.yml -f frontend/compose.yml convert
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  ports:
    - name: "80"
      port: 80
      targetPort: 80
  selector:
    io.kompose.service: frontend
  type: LoadBalancer
  externalIPs:
    - 192.168.0.198
